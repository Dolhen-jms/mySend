# Construit mySend pour macOS (interface terminal) sur un vrai Mac :
# - à chaque push sur main : compilation, tests, archive disponible dans les « artifacts » ;
# - sur un tag v* (ex. git tag v0.1.0 && git push --tags) : archive publiée dans une release,
#   téléchargeable par https://github.com/Dolhen-jms/mySend/releases/latest/download/mysend-macos.tar.gz
name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: cargo test --release --lib --bin mysend

      - name: Archive (mysend + rsync universels)
        run: sh packaging/macos/build.sh

      - name: Vérification
        run: |
          ./dist/mysend-macos/mysend --help
          ./dist/mysend-macos/rsync --version | head -1
          # installation et lancement depuis un autre dossier
          PREFIX="$RUNNER_TEMP/inst" sh dist/mysend-macos/install.sh
          "$RUNNER_TEMP/inst/bin/mysend" --help

      - uses: actions/upload-artifact@v4
        with:
          name: mysend-macos
          path: dist/mysend-macos.tar.gz

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mysend-macos.tar.gz \
            --title "mySend $GITHUB_REF_NAME" \
            --notes "Archive macOS (Apple Silicon + Intel) : voir la section macOS du README."
